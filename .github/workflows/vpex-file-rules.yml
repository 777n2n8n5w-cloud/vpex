# Tests the rules for lead files (storage-rules.txt) with Google's own rules engine, on any branch.
# Nothing is published: the deploy workflow puts the rules live from main, after the same test.
name: Test VPEX file rules

on:
  push:
    paths:
      - "storage-rules.txt"
      - "tools/storage_rules_test.py"
      - ".github/workflows/vpex-file-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PROJECT: dovetail-f863c
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Test the rules
        run: python3 tools/storage_rules_test.py
