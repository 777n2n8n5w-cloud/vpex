# Puts VPEX's notification code (functions/), database rules (firestore-rules.txt) and the rules for
# lead files (storage-rules.txt, tested first) live in Firebase. Sets up the file store the first time.
# Before the Firebase project is on the Blaze plan, only the database rules go live.
# Runs by itself when those files change, or from the Actions tab: "Deploy VPEX notifications" > Run workflow.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT (the Google key file's text).
name: Deploy VPEX notifications

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - "firestore-rules.txt"
      - "storage-rules.txt"
      - "tools/storage_rules_test.py"
      - "tools/files_live_check.py"
      - ".github/workflows/vpex-notifications.yml"
  workflow_dispatch:

concurrency:
  group: vpex-notifications
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PROJECT: dovetail-f863c
    steps:
      - uses: actions/checkout@v4

      - name: Anything to deploy?
        id: has
        run: |
          if [ -f functions/index.js ] && [ -f firebase.json ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "go=no" >> "$GITHUB_OUTPUT"; echo "::notice::The notification code isn't in the repo yet."; fi

      - if: steps.has.outputs.go == 'yes'
        name: Check the Google key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::No key yet. Add a repository secret named FIREBASE_SERVICE_ACCOUNT (Settings > Secrets and variables > Actions), then run this again."
            exit 1
          fi
          printf '%s' "$SA" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
          except Exception:
              print('::error::The FIREBASE_SERVICE_ACCOUNT secret is not the key file text. Paste the whole file, from { to }.'); sys.exit(1)
          if d.get('type') != 'service_account' or not d.get('private_key'):
              print('::error::That secret is not a service account key.'); sys.exit(1)
          print('Key belongs to', d.get('client_email'), 'in project', d.get('project_id'))
          if d.get('project_id') != 'dovetail-f863c':
              print('::error::This key is for project ' + str(d.get('project_id')) + ', not dovetail-f863c.'); sys.exit(1)
          "

      - if: steps.has.outputs.go == 'yes'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - if: steps.has.outputs.go == 'yes'
        uses: google-github-actions/setup-gcloud@v2

      - if: steps.has.outputs.go == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: steps.has.outputs.go == 'yes'
        name: Check the Blaze plan
        id: bill
        run: |
          gcloud services enable cloudbilling.googleapis.com --project "$PROJECT" >/dev/null 2>&1 || true
          BILL=$(gcloud billing projects describe "$PROJECT" --format='value(billingEnabled)' 2>/dev/null || echo "unknown")
          echo "Billing on: $BILL"
          if [ "$BILL" = "False" ]; then echo "blaze=no" >> "$GITHUB_OUTPUT"; else echo "blaze=yes" >> "$GITHUB_OUTPUT"; fi

      - if: steps.has.outputs.go == 'yes'
        name: Turn on the Google services notifications use
        run: |
          if [ "${{ steps.bill.outputs.blaze }}" != "yes" ]; then
            gcloud services enable firestore.googleapis.com firebaserules.googleapis.com fcm.googleapis.com fcmregistrations.googleapis.com \
              firebaseinstallations.googleapis.com --project "$PROJECT"
            exit 0
          fi
          gcloud services enable compute.googleapis.com cloudfunctions.googleapis.com cloudbuild.googleapis.com \
            artifactregistry.googleapis.com run.googleapis.com eventarc.googleapis.com pubsub.googleapis.com \
            cloudscheduler.googleapis.com firestore.googleapis.com firebaserules.googleapis.com iam.googleapis.com identitytoolkit.googleapis.com \
            fcm.googleapis.com fcmregistrations.googleapis.com firebaseinstallations.googleapis.com \
            storage.googleapis.com firebasestorage.googleapis.com --project "$PROJECT"

      - if: steps.has.outputs.go == 'yes' && steps.bill.outputs.blaze == 'yes'
        name: Give Google's build and event services the access they need
        run: |
          NUM=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')
          COMPUTE="$NUM-compute@developer.gserviceaccount.com"
          for i in 1 2 3 4 5 6 7 8 9; do
            gcloud iam service-accounts describe "$COMPUTE" --project "$PROJECT" >/dev/null 2>&1 && break
            echo "Waiting for Google to create the default service account ($i)..."; sleep 20
          done
          gcloud beta services identity create --service=pubsub.googleapis.com --project "$PROJECT" >/dev/null 2>&1 || true
          gcloud beta services identity create --service=eventarc.googleapis.com --project "$PROJECT" >/dev/null 2>&1 || true
          bind() {
            if gcloud projects add-iam-policy-binding "$PROJECT" --member="serviceAccount:$1" --role="$2" --condition=None --quiet >/dev/null 2>&1; then
              echo "ok  $2  ->  $1"
            else
              echo "::warning::Couldn't give $2 to $1 (the deploy may still work)."
            fi
          }
          bind "$COMPUTE" roles/cloudbuild.builds.builder
          bind "$COMPUTE" roles/logging.logWriter
          bind "$COMPUTE" roles/artifactregistry.writer
          bind "$COMPUTE" roles/eventarc.eventReceiver
          bind "$COMPUTE" roles/run.invoker
          bind "$COMPUTE" roles/datastore.user
          bind "$COMPUTE" roles/firebasecloudmessaging.admin
          bind "$COMPUTE" roles/firebaseauth.viewer
          bind "service-$NUM@gcp-sa-pubsub.iam.gserviceaccount.com" roles/iam.serviceAccountTokenCreator

      - if: steps.has.outputs.go == 'yes' && steps.bill.outputs.blaze == 'yes'
        name: Find where the database lives
        run: |
          LOC=$(gcloud firestore databases describe --database='(default)' --project "$PROJECT" --format='value(locationId)')
          case "$LOC" in
            nam5|nam7) R=us-central1 ;;
            eur3) R=europe-west1 ;;
            "") echo "::error::Couldn't read where the database lives."; exit 1 ;;
            *) R="$LOC" ;;
          esac
          echo "Database in $LOC, so the notification code runs in $R"
          echo "FN_REGION=$R" > functions/.env

      - if: steps.has.outputs.go == 'yes' && steps.bill.outputs.blaze == 'yes'
        name: Install
        run: npm install --prefix functions --no-audit --no-fund

      - if: steps.has.outputs.go == 'yes'
        name: Show how the database rules change
        run: |
          T=$(gcloud auth print-access-token)
          API=https://firebaserules.googleapis.com/v1
          RS=$(curl -sf -H "Authorization: Bearer $T" "$API/projects/$PROJECT/releases/cloud.firestore" | python3 -c "import sys,json; print(json.load(sys.stdin).get('rulesetName',''))" 2>/dev/null || true)
          if [ -z "$RS" ]; then echo "No database rules published yet."; exit 0; fi
          curl -sf -H "Authorization: Bearer $T" "$API/$RS" | python3 -c "import sys,json; print(json.load(sys.stdin)['source']['files'][0]['content'], end='')" > /tmp/live-rules.txt || { echo "Couldn't read the live rules."; exit 0; }
          echo "Live rules: $RS"
          note() { python3 -c "import sys; t=sys.stdin.read()[:6000]; print('::notice title=$1::' + t.replace('%','%25').replace('\r','').replace('\n','%0A'))"; }
          if diff -u /tmp/live-rules.txt firestore-rules.txt > /tmp/rules.diff; then
            echo "No change."
            # Already the same: compare with the rules that were live before this repo's version went up
            PREV=$(curl -sf -H "Authorization: Bearer $T" "$API/projects/$PROJECT/rulesets?pageSize=10" | python3 -c "
          import sys, json
          r = sorted(json.load(sys.stdin).get('rulesets', []), key=lambda x: x.get('createTime', ''), reverse=True)
          names = [x['name'] for x in r]
          cur = sys.argv[1]
          i = names.index(cur) if cur in names else -1
          print(names[i + 1] if 0 <= i < len(names) - 1 else '')" "$RS" 2>/dev/null || true)
            if [ -n "$PREV" ] && curl -sf -H "Authorization: Bearer $T" "$API/$PREV" | python3 -c "import sys,json; print(json.load(sys.stdin)['source']['files'][0]['content'], end='')" > /tmp/prev-rules.txt; then
              if diff -u /tmp/prev-rules.txt firestore-rules.txt > /tmp/prev.diff; then echo "Same as the rules before it too." | note "Database rules: no change"
              else (echo "Compared with $PREV"; grep -E '^[-+][^-+]' /tmp/prev.diff) | note "Database rules: changes since the previous version"; fi
            fi
          else
            grep -E '^[-+][^-+]' /tmp/rules.diff | note "Database rules: what this deploy changes"
          fi

      - if: steps.has.outputs.go == 'yes' && steps.bill.outputs.blaze == 'yes'
        name: Set up the file store for lead files
        id: files
        run: |
          T=$(gcloud auth print-access-token)
          API="https://firebasestorage.googleapis.com/v1beta/projects/$PROJECT/defaultBucket"
          name() { python3 -c "import sys,json; print(json.load(sys.stdin).get('bucket',{}).get('name','').split('/')[-1])"; }
          B=$(curl -sf -H "Authorization: Bearer $T" "$API" | name || true)
          if [ -z "$B" ]; then
            LOC=$(gcloud firestore databases describe --database='(default)' --project "$PROJECT" --format='value(locationId)')
            case "$LOC" in nam5|nam7|us-central1) BL=US-CENTRAL1 ;; us-east1) BL=US-EAST1 ;; us-west1) BL=US-WEST1 ;; eur3) BL=EUROPE-WEST1 ;; *) BL=$(echo "$LOC" | tr a-z A-Z) ;; esac
            echo "No file store yet. Making one in $BL, next to the database ($LOC)."
            for i in 1 2 3; do
              B=$(curl -s -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" "$API" -d "{\"location\":\"$BL\"}" | tee /tmp/bucket.json | name || true)
              [ -n "$B" ] && break
              B=$(curl -sf -H "Authorization: Bearer $T" "$API" | name || true)
              [ -n "$B" ] && break
              echo "Not yet:"; head -c 600 /tmp/bucket.json; echo; sleep 30
            done
          fi
          if [ -z "$B" ]; then echo "::error title=Lead files::Couldn't make the file store for lead files."; echo "ok=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "File store: $B"
          # The file rules look up who's an active login in the database. The file store's own Google account
          # needs the Firebase Rules Firestore role for that; it only exists once the store does, so it's given here.
          NUM=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')
          AG="service-$NUM@gcp-sa-firebasestorage.iam.gserviceaccount.com"
          gcloud beta services identity create --service=firebasestorage.googleapis.com --project "$PROJECT" 2>&1 | tail -1 || true
          GOT=no
          for i in 1 2 3 4 5 6 7 8; do
            if gcloud projects get-iam-policy "$PROJECT" --flatten='bindings[].members' --filter="bindings.role=roles/firebaserules.firestoreServiceAgent AND bindings.members=serviceAccount:$AG" --format='value(bindings.role)' 2>/dev/null | grep -q firestoreServiceAgent; then GOT=yes; break; fi
            if gcloud projects add-iam-policy-binding "$PROJECT" --member="serviceAccount:$AG" --role=roles/firebaserules.firestoreServiceAgent --condition=None --quiet >/dev/null 2>/tmp/bind.err; then GOT=yes; break; fi
            echo "Not yet ($i): $(tail -c 300 /tmp/bind.err | tr '\n' ' ')"; sleep 20
          done
          if [ "$GOT" = "yes" ]; then echo "The file store can check logins ($AG has the Firebase Rules Firestore role)."
          else echo "::error title=Lead files::Couldn't give the file store access to check logins: $(tail -c 400 /tmp/bind.err | tr '\n' ' ')"; fi
          echo "ok=yes" >> "$GITHUB_OUTPUT"

      - if: steps.has.outputs.go == 'yes'
        name: Test the rules for lead files
        run: python3 tools/storage_rules_test.py

      - if: steps.has.outputs.go == 'yes'
        name: Deploy
        run: |
          if [ "${{ steps.bill.outputs.blaze }}" != "yes" ]; then
            npx --yes firebase-tools@latest deploy --only firestore:rules --project "$PROJECT" --force --non-interactive
            echo "::error::Database rules are live. The notification code needs the Firebase project on the Blaze plan: upgrade it in the Firebase console, then run this again."
            exit 1
          fi
          for i in 1 2 3; do
            if npx --yes firebase-tools@latest deploy --only functions,firestore:rules --project "$PROJECT" --force --non-interactive; then
              echo "Notifications are live."
              exit 0
            fi
            echo "Attempt $i didn't finish. The first deploy often has to wait while Google switches new services on. Trying again in 2 minutes."
            sleep 120
          done
          exit 1

      - if: steps.has.outputs.go == 'yes' && steps.files.outputs.ok == 'yes'
        name: Put the rules for lead files live
        run: |
          for i in 1 2 3; do
            if npx --yes firebase-tools@latest deploy --only storage --project "$PROJECT" --force --non-interactive; then
              echo "Lead files are on: only each office's active logins can open, add or delete them."
              exit 0
            fi
            echo "Attempt $i didn't finish. A new file store can take a minute to be ready. Trying again in 1 minute."
            sleep 60
          done
          exit 1

      - if: steps.has.outputs.go == 'yes' && steps.files.outputs.ok == 'yes'
        name: Check lead files end to end
        run: |
          # A throwaway office and login upload, open and delete a file the way the app does; then everything is removed.
          # New rules and access can take a minute or two to reach every Google server, so it tries up to 3 times.
          for i in 1 2 3; do
            if python3 tools/files_live_check.py; then exit 0; fi
            [ "$i" = "3" ] || { echo "Trying again in 2 minutes."; sleep 120; }
          done
          exit 1
