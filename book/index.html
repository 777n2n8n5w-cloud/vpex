<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://us-central1-dovetail-f863c.cloudfunctions.net; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)">
<title>Pick a time for your call</title>
<meta property="og:title" content="Pick a time for your call">
<meta property="og:description" content="Tap to choose when you’d like to get the call. It takes a few seconds.">
<meta name="description" content="Tap to choose when you’d like to get the call. It takes a few seconds.">
<link rel="apple-touch-icon" href="/book/book-icon-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="/book/book-icon-64.png">
<link rel="icon" type="image/png" sizes="512x512" href="/book/book-icon-512.png">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #151a21; --dim: #5a6370; --faint: #8b94a1; --line: #e3e6eb;
    --teal: #0e6b63; --teal-ink: #ffffff; --teal-soft: #e3f1ef; --warn: #a8461f;
    --r: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101418; --card: #171c22; --ink: #eef1f4; --dim: #a3acb8; --faint: #77808c; --line: #2a313a; --teal: #43b3a7; --teal-ink: #08201d; --teal-soft: #15302d; --warn: #f08a5d; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 16px calc(130px + env(safe-area-inset-bottom)); }
  .co { margin: 0 0 18px; font-size: 15px; font-weight: 600; color: var(--dim); }
  h1 { margin: 0; font-size: 28px; line-height: 1.15; letter-spacing: -.02em; font-weight: 700; }
  .sub { margin: 10px 0 0; color: var(--dim); font-size: 16px; }
  .days { display: flex; gap: 8px; margin: 26px -16px 0; padding: 2px 16px 6px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
  .days::-webkit-scrollbar { display: none; }
  .day { flex: none; scroll-snap-align: start; min-width: 72px; padding: 10px 12px 9px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card);
    color: var(--ink); font: inherit; text-align: center; cursor: pointer; }
  .day b { display: block; font-size: 13px; font-weight: 600; color: var(--dim); }
  .day span { display: block; font-size: 22px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .day small { display: block; font-size: 11.5px; color: var(--faint); }
  .day[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .day[aria-pressed="true"] b, .day[aria-pressed="true"] small { color: inherit; opacity: .75; }
  .dayname { margin: 22px 0 10px; font-size: 15px; font-weight: 600; color: var(--dim); }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 16px; font-weight: 600;
    font-variant-numeric: tabular-nums; cursor: pointer; }
  .slot[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--teal-ink); }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 92%, transparent);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
  .bar-in { max-width: 520px; margin: 0 auto; }
  .bar p { margin: 0 0 8px; font-size: 14.5px; color: var(--dim); min-height: 21px; }
  .bar p b { color: var(--ink); }
  .go { display: block; width: 100%; min-height: 52px; border: 0; border-radius: var(--r); background: var(--teal); color: var(--teal-ink); font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; }
  .go:disabled { opacity: .4; cursor: default; }
  .note { margin: 18px 0 0; font-size: 14.5px; color: var(--warn); }
  .done { text-align: left; }
  .check { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal); margin-bottom: 20px; }
  .when { margin: 18px 0 0; padding: 16px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); }
  .when b { display: block; font-size: 20px; letter-spacing: -.01em; }
  .when span { color: var(--dim); font-size: 14.5px; }
  .acts { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .sec { display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font: inherit; font-size: 16px; font-weight: 600; text-decoration: none; cursor: pointer; }
  .skel { height: 48px; border-radius: 12px; background: var(--line); opacity: .6; }
  .skel.w { height: 74px; width: 72px; flex: none; border-radius: var(--r); }
  @media (prefers-reduced-motion: no-preference) { .skel { animation: pulse 1.2s ease-in-out infinite alternate; } @keyframes pulse { to { opacity: .25; } } }
  footer { margin-top: 40px; font-size: 12.5px; color: var(--faint); }
  footer a { color: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="app" aria-live="polite">
  <p class="co" id="co">&nbsp;</p>
  <h1 id="h1">Finding times…</h1>
  <p class="sub" id="sub">&nbsp;</p>
  <div class="days" id="days"><div class="skel w"></div><div class="skel w"></div><div class="skel w"></div><div class="skel w"></div></div>
  <p class="dayname" id="dayname"></p>
  <div class="slots" id="slots"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <p class="note" id="note" hidden></p>
  <footer>Your answer goes only to the person who sent you this link. <a href="/privacy/">Privacy</a> · Scheduling by <a href="/">VPEX</a></footer>
</main>
<div class="bar" id="bar" hidden><div class="bar-in"><p id="pick">Pick a time above.</p><button type="button" class="go" id="go" disabled>Book this time</button></div></div>
<script>
(function () {
  "use strict";
  var FN = window.__BOOK_FN || "https://us-central1-dovetail-f863c.cloudfunctions.net/book";
  var key = decodeURIComponent((location.hash || "").replace(/^#/, "")).trim();
  var $ = function (id) { return document.getElementById(id); };
  var V = null, day = null, at = null, busy = false;
  var tz = "";
  try { tz = new Intl.DateTimeFormat("en-US", { timeZoneName: "short" }).formatToParts(new Date()).filter(function (p) { return p.type === "timeZoneName"; })[0].value; } catch (e) {}
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function ymd(t) { var d = new Date(t); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  function time(t) { return new Date(t).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); }
  function longDay(t) {
    var d = new Date(t), today = new Date(), tm = new Date(); tm.setDate(today.getDate() + 1);
    var name = d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
    return ymd(t) === ymd(today) ? "Today, " + name.split(", ").slice(1).join(", ") : ymd(t) === ymd(tm) ? "Tomorrow, " + name.split(", ").slice(1).join(", ") : name;
  }
  function full(t) { return longDay(t) + " at " + time(t); }
  function who() { return V && V.rep ? V.rep : "We"; }
  function gone(msg) {
    $("co").textContent = V && V.co ? V.co : " ";
    $("h1").textContent = "This link has expired";
    $("sub").textContent = msg || "It may have been turned off, or it’s older than two weeks. Reply to the text you got and ask for a new one.";
    $("days").innerHTML = ""; $("slots").innerHTML = ""; $("dayname").textContent = ""; $("bar").hidden = true;
  }
  function groups() {
    var g = [], by = {};
    (V.slots || []).forEach(function (t) { var k = ymd(t); if (!by[k]) { by[k] = { k: k, t: t, list: [] }; g.push(by[k]); } by[k].list.push(t); });
    return g;
  }
  function render() {
    if (!V) return;
    $("co").textContent = V.co || " ";
    if (V.picked && !V.changing) return renderDone();
    var g = groups();
    $("h1").textContent = "Pick a time for " + (V.rep || "us") + " to call you";
    $("sub").textContent = "Hi " + V.first + ". Tap a time that works. Times are in your time zone" + (tz ? " (" + tz + ")" : "") + ".";
    $("bar").hidden = !g.length;
    if (!g.length) {
      $("days").innerHTML = ""; $("slots").innerHTML = ""; $("dayname").textContent = "";
      $("note").hidden = false; $("note").textContent = "There are no open times this week. Reply to the text and " + who() + " will find one with you.";
      return;
    }
    if (!day || !g.some(function (x) { return x.k === day; })) day = g[0].k;
    $("days").innerHTML = g.map(function (x) {
      var d = new Date(x.t);
      return '<button type="button" class="day" data-day="' + x.k + '" aria-pressed="' + (x.k === day) + '" aria-label="' + esc(longDay(x.t)) + ', ' + x.list.length + ' times">' +
        '<b>' + esc(d.toLocaleDateString("en-US", { weekday: "short" })) + '</b><span>' + d.getDate() + '</span><small>' + esc(d.toLocaleDateString("en-US", { month: "short" })) + '</small></button>';
    }).join("");
    var cur = g.filter(function (x) { return x.k === day; })[0];
    $("dayname").textContent = longDay(cur.t);
    $("slots").innerHTML = cur.list.map(function (t) {
      return '<button type="button" class="slot" data-at="' + t + '" aria-pressed="' + (t === at) + '">' + esc(time(t)) + '</button>';
    }).join("");
    $("pick").innerHTML = at ? "<b>" + esc(full(at)) + "</b>" : "Pick a time above.";
    $("go").disabled = !at || busy;
    $("go").textContent = busy ? "Booking…" : V.picked ? "Move my call to this time" : "Book this time";
  }
  function ics(t) {
    var p = function (n) { return (n < 10 ? "0" : "") + n; }, s = function (x) { var d = new Date(x); return d.getUTCFullYear() + p(d.getUTCMonth() + 1) + p(d.getUTCDate()) + "T" + p(d.getUTCHours()) + p(d.getUTCMinutes()) + "00Z"; };
    var title = "Call with " + (V.rep || "") + (V.co ? " (" + V.co + ")" : "");
    var body = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//VPEX//Booking//EN", "BEGIN:VEVENT", "UID:" + t + "-" + Math.random().toString(36).slice(2) + "@vpexdialer.com",
      "DTSTAMP:" + s(Date.now()), "DTSTART:" + s(t), "DTEND:" + s(t + 1800000), "SUMMARY:" + title.replace(/[,;\\]/g, " "), "DESCRIPTION:" + (V.rep || "They") + " will call you.",
      "BEGIN:VALARM", "TRIGGER:-PT10M", "ACTION:DISPLAY", "DESCRIPTION:" + title.replace(/[,;\\]/g, " "), "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
    return "data:text/calendar;charset=utf-8," + encodeURIComponent(body);
  }
  function renderDone() {
    $("bar").hidden = true; $("days").innerHTML = ""; $("dayname").textContent = ""; $("note").hidden = true;
    $("h1").textContent = "You’re booked";
    $("sub").textContent = (V.rep || "We") + " will call you then. Nothing else to do.";
    $("slots").innerHTML = "";
    var box = document.createElement("div"); box.className = "done";
    box.innerHTML = '<div class="when"><b>' + esc(full(V.picked)) + '</b><span>Your time' + (tz ? " (" + esc(tz) + ")" : "") + '</span></div>' +
      '<div class="acts"><a class="sec" id="cal" download="call.ics" href="' + ics(V.picked) + '">Add to my calendar</a>' +
      '<button type="button" class="sec" id="change">Pick a different time</button></div>';
    $("slots").appendChild(box);
    $("slots").style.display = "block";
  }
  function load() {
    if (!/^vb_/.test(key)) { gone("This link looks incomplete. Open it straight from the text you got, or reply to ask for a new one."); return; }
    fetch(FN + "?k=" + encodeURIComponent(key), { cache: "no-store" }).then(function (r) {
      if (r.status === 404) { gone(); return null; }
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (v) { if (!v) return; V = v; render(); }).catch(function () {
      $("h1").textContent = "Couldn’t load the times";
      $("sub").textContent = "Check your connection and try again.";
      $("days").innerHTML = ""; $("slots").innerHTML = '<button type="button" class="sec" id="retry" style="grid-column:1/-1">Try again</button>';
    });
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("button") : null; if (!t) return;
    if (t.id === "retry") { $("slots").innerHTML = ""; load(); return; }
    if (t.id === "change") { V.changing = true; at = null; $("slots").style.display = ""; render(); return; }
    if (t.hasAttribute("data-day")) { day = t.getAttribute("data-day"); render(); return; }
    if (t.hasAttribute("data-at")) { at = Number(t.getAttribute("data-at")); $("note").hidden = true; render(); return; }
    if (t.id === "go" && at && !busy) {
      busy = true; render();
      fetch(FN, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ k: key, at: at }) }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) { return { s: r.status, j: j }; });
      }).then(function (x) {
        busy = false;
        if (x.s === 200) { V = x.j; V.changing = false; at = null; render(); window.scrollTo(0, 0); return; }
        if (x.s === 404) { gone(); return; }
        if (x.s === 409 && x.j && x.j.view) { V = Object.assign(x.j.view, { changing: V.changing }); at = null; render(); $("note").hidden = false; $("note").textContent = "That time was just taken. Pick another."; return; }
        throw new Error(x.s);
      }).catch(function () { busy = false; render(); $("note").hidden = false; $("note").textContent = "Couldn’t book that. Check your connection and tap Book again."; });
    }
  });
  load();
})();
</script>
</body>
</html>
